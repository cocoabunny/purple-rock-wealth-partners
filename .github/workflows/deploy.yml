
name: Deploy Purple Rock Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Build Next.js website
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ID }}

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/about/index.html
          test -f out/services/index.html
          test -f out/contact/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt

          for service in \
            business-valuation \
            funding-capital \
            growth-strategy \
            licensing-solutions \
            mergers-acquisitions \
            strategic-partnerships \
            succession-planning \
            technology-integration
          do
            test -f "out/services/$service/index.html"
          done

          test -f out/insights/index.html
          echo "Static export verified."

      - name: Add GitHub Pages compatibility file
        run: touch out/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
